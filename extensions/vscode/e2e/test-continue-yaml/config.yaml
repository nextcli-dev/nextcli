name: Test Config
version: 0.0.1
schema: v1

rules:
  - TEST_SYS_MSG

models:
  - name: TEST LLM
    provider: test
    model: this field is not used
    roles:
      - chat
      - edit
      - apply
      - autocomplete

  - name: Mock
    provider: mock
    model: this field is not used
    roles:
      - chat
      - edit
      - apply

  - name: TOOL MOCK LLM
    provider: mock
    model: claude-3-5-sonnet-latest
    requestOptions:
      extraBodyProperties:
        chatStream:
          - - role: assistant
              content: "I'm going to call a tool:"
            - role: assistant
              content: ""
              toolCalls:
                - id: test_id
                  type: function
                  function:
                    name: view_diff
          - - REPEAT_LAST_MSG
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  - name: EDIT TOOLS MOCK LLM
    provider: mock
    model: this field is not used
    requestOptions:
      extraBodyProperties:
        chatStream:
          - - role: assistant
              content: Editing the fixtures
            - role: assistant
              content: ""
              toolCalls:
                - id: edit_1
                  type: function
                  function:
                    name: single_find_and_replace
                    arguments: '{"filepath": "edit-fixtures/crlf.js", "old_string": "function sub(a, b) {\n  return a - b;\n}", "new_string": "function sub(a, b) {\n  // subtract\n  return a - b;\n}"}'
          - - role: assistant
              content: ""
              toolCalls:
                - id: edit_2
                  type: function
                  function:
                    name: edit_existing_file
                    arguments: '{"filepath": "edit-fixtures/crlf-rewrite.js", "changes": "function mul(a, b) {\n  // multiply\n  return a * b;\n}\n\nmodule.exports = { mul };\n"}'
          - - role: assistant
              content: EDITS DONE
    roles:
      - chat
    capabilities:
      - tool_use

  - name: SYSTEM MESSAGE MOCK LLM
    provider: mock
    model: claude-3-5-sonnet-latest
    requestOptions:
      extraBodyProperties:
        chatStream:
          - - REPEAT_SYSTEM_MSG
    roles:
      - chat
      - edit
      - apply

  - name: LAST MESSAGE MOCK LLM
    provider: mock
    model: claude-3-5-sonnet-latest
    requestOptions:
      extraBodyProperties:
        chatStream:
          - - REPEAT_LAST_MSG
    roles:
      - chat
      - edit
      - apply

context:
  - provider: docs
  - provider: diff
  - provider: url
  - provider: folder
  - provider: terminal
