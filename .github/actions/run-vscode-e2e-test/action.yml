name: "Run VS Code E2E Test"
description: "Run a single VS Code E2E test with all required setup"
inputs:
  test_file:
    description: "E2E test file to run"
    required: true
  command:
    description: "Command to run (e2e:ci:run or e2e:ci:run-yaml)"
    required: true
  github_token:
    description: "GitHub token for authenticated API requests (e.g., @vscode/ripgrep download)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"

    # The VS Code version the e2e tests download and select locators for.
    # Cached storage must match it: run-tests with locators for one version
    # against a cached binary of another fails in every hook.
    - name: Read the e2e VS Code version
      id: e2e-vscode
      shell: bash
      run: echo "version=$(node -p "require('./extensions/vscode/package.json').config.e2eVscodeVersion")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: vscode-node-modules-cache
      with:
        path: extensions/vscode/node_modules
        key: ${{ runner.os }}-vscode-node-modules-${{ hashFiles('extensions/vscode/package-lock.json') }}

    - uses: actions/cache@v6
      id: storage-cache
      with:
        path: extensions/vscode/e2e/storage
        key: ${{ runner.os }}-vscode-storage-${{ steps.e2e-vscode.outputs.version }}-${{ hashFiles('extensions/vscode/package-lock.json') }}

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: vscode-extension-build-Linux
        path: extensions/vscode/build

    - name: Build packages and download e2e dependencies
      shell: bash
      run: |
        node ./scripts/build-packages.js
        if [ "${{ steps.storage-cache.outputs.cache-hit }}" != "true" ]; then
          cd core
          npm ci
          cd ../extensions/vscode
          npm ci
          npm run e2e:ci:download
        else
          cd core
          npm ci
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Fix VSCode binary permissions
      shell: bash
      run: |
        chmod +x extensions/vscode/e2e/storage/VSCode-linux-x64/code
        chmod +x extensions/vscode/e2e/storage/chromedriver-linux64/chromedriver

    # xvfb-run waits for the X server before it starts the tests. The screen
    # is larger than the 1200x800 window e2e/Baseline.ts checks for.
    - name: Run e2e tests
      shell: bash
      run: |
        cd extensions/vscode
        TEST_FILE="${{ inputs.test_file }}" \
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          npm run ${{ inputs.command }}

    - name: Sanitize test file name
      id: sanitize_filename
      if: always()
      shell: bash
      run: |
        FILENAME="${{ inputs.test_file }}"
        SANITIZED_FILENAME="${FILENAME//\//-}" # Replace / with - using bash parameter expansion
        echo "sanitized_test_file=${SANITIZED_FILENAME}" >> $GITHUB_OUTPUT

    # Screenshots (test bodies and, through the hook wrappers, hooks), the VS
    # Code logs (exthost.log has the extension's own output), and the
    # ChromeDriver and WebDriver logs.
    - name: Upload e2e failure evidence
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-failure-${{ steps.sanitize_filename.outputs.sanitized_test_file || 'unknown' }}-${{ inputs.command == 'e2e:ci:run-yaml' && 'yaml' || 'json' }}
        path: |
          extensions/vscode/e2e/storage/screenshots
          extensions/vscode/e2e/storage/settings/logs
          extensions/vscode/e2e/storage/chromedriver.log
          extensions/vscode/e2e/storage/test.log
          extensions/vscode/e2e/storage/crashes
        if-no-files-found: warn
