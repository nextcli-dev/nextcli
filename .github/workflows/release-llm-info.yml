name: Release @continuedev/llm-info
# Disabled until NextCLI has its own publish credentials and extension IDs.
# Restore the commented triggers to turn this workflow back on.
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - "packages/llm-info/**"
#       - ".github/workflows/release-llm-info.yml"
#       - ".github/workflows/reusable-release.yml"
#
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    # Only run this workflow on the main repository (nextcli-dev/nextcli)
    if: github.repository == 'nextcli-dev/nextcli'
    uses: ./.github/workflows/reusable-release.yml
    with:
      package-name: "llm-info"
      package-path: "packages/llm-info"
    secrets:
      SEMANTIC_RELEASE_GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
      SEMANTIC_RELEASE_NPM_TOKEN: ${{ secrets.SEMANTIC_RELEASE_NPM_TOKEN }}
