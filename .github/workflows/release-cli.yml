name: CLI Release

# Publishes @nextcli/cli to npm.
#
#   Release  release-please creates release `cli-vX.Y.Z` when its Release PR
#            is merged. The version comes from extensions/cli/package.json,
#            which release-please bumps in that PR. Publishes in env
#            `production`.
#   Dry run  Run this workflow manually to build, test and pack the CLI at the
#            selected ref without publishing.
#
# npm trusted publishing (OIDC) is bound to this file name, so keep it.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-cli-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    if: github.repository == 'nextcli-dev/nextcli' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'cli-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      - name: Read and check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./extensions/cli/package.json').version")
          if [ -n "$TAG" ] && [ "${TAG#cli-v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match extensions/cli/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CLI version $version"

      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        working-directory: core
        run: npm run build

      - name: Check the version is not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@nextcli/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@nextcli/cli@${VERSION} is already on npm."
            exit 1
          fi

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: npm ci

      - name: Build
        working-directory: extensions/cli
        run: npm run build

      - name: Run tests
        working-directory: extensions/cli
        run: npm test

      - name: Run smoke tests
        working-directory: extensions/cli
        run: npm run test:smoke

      - name: Pack and install the tarball
        id: pack
        working-directory: extensions/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # prepack prints the build log on stdout, so npm pack --json is not valid JSON.
          npm pack > "$RUNNER_TEMP/npm-pack.txt"
          tarball="$(grep -E '^nextcli-cli-.+\.tgz$' "$RUNNER_TEMP/npm-pack.txt" | tail -n 1)"
          if [ -z "$tarball" ] || [ ! -f "$tarball" ]; then
            echo "Could not find the packed tarball."
            cat "$RUNNER_TEMP/npm-pack.txt"
            exit 1
          fi
          echo "Packed ${tarball}"
          # List once: grep -q closes the pipe early, and with pipefail that makes tar fail.
          tar -tzf "$tarball" > "$RUNNER_TEMP/tarball-files.txt"
          if grep -E '(^|/)src/' "$RUNNER_TEMP/tarball-files.txt"; then
            echo "Tarball contains source files."
            exit 1
          fi
          for required in package/LICENSE package/NOTICE package/README.md package/package.json package/dist/cn.js package/dist/index.js; do
            if ! grep -qx "$required" "$RUNNER_TEMP/tarball-files.txt"; then
              echo "Tarball is missing ${required}."
              exit 1
            fi
          done
          if grep -qx 'package/dist/meta.json' "$RUNNER_TEMP/tarball-files.txt"; then
            echo "Tarball contains dist/meta.json."
            exit 1
          fi
          npm i -g --prefix "$RUNNER_TEMP/cn" "./$tarball"
          installed="$("$RUNNER_TEMP/cn/bin/cn" --version | tail -n 1)"
          if [ "$installed" != "$VERSION" ]; then
            echo "Installed cn --version printed '${installed}', expected '${VERSION}'."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: extensions/cli/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: dist-tarball

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: extensions/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ github.workspace }}/dist-tarball/${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            # An empty token line from setup-node overrides trusted publishing.
            npm config delete "//registry.npmjs.org/:_authToken"
            unset NODE_AUTH_TOKEN
          fi
          npm publish "$TARBALL" --tag latest
          echo "Published @nextcli/cli@${{ needs.build.outputs.version }}"

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-tarball/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
