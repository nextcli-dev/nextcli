name: Publish VS Code Extension

# Builds the extension for all 8 targets and publishes it to Open VSX and the
# Visual Studio Marketplace.
#
#   Stable       release-please creates release `vscode-vX.Y.Z` (even minor)
#                when its Release PR is merged. Publishes in env `production`.
#   Pre-release  Run this workflow from main with channel `pre-release`. It
#                picks the next odd-minor version (stable 1.6.x -> 1.7.N),
#                stamps it at build time (no commit), creates the tag and the
#                GitHub pre-release, and publishes in env `staging` to the
#                Marketplace only (see the Open VSX step).
#
#   Only a stable version that's higher than every pre-release becomes the
#   default for pre-release users, so the next stable minor (1.6.0 after
#   1.5.x) is set with a `Release-As:` footer on a commit to main.
#   Dry run      Run this workflow with channel `dry-run` to build all targets
#                for any ref. Nothing is published.
#   Republish    Run this workflow from main with channel `republish` and the
#                `tag` of a stable release (vscode-vX.Y.Z) that was created but
#                not published, because its publish job failed. It publishes
#                the .vsix files attached to that release, in env `production`.
#                Re-running the failed job uses the workflow from the tagged
#                commit, so a bug in it can't be fixed that way. Versions that
#                are already published are skipped.
#
# Trusted publishing binds to this file name, so keep it:
#   - Open VSX: one trusted publisher for this file, environment left blank.
#   - Marketplace: this file with env `production`, and this file with env
#     `staging`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "pre-release publishes from main; dry-run only builds; republish publishes an existing release"
        type: choice
        options: [dry-run, pre-release, republish]
        default: dry-run
      ref:
        description: "Ref to build for a dry run (ignored for pre-release, which uses main)"
        type: string
        default: main
      tag:
        description: "republish only: the stable release tag to publish, for example vscode-v1.6.10"
        type: string
        default: ""

concurrency:
  group: publish-vscode-${{ github.event.release.tag_name || (inputs.channel == 'republish' && inputs.tag) || inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'dry-run' && inputs.ref || '' }}

      - name: Resolve channel and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          TAG_INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./extensions/vscode/package.json').version")
          major=$(echo "$version" | cut -d. -f1)
          minor=$((10#$(echo "$version" | cut -d. -f2)))
          sha=$(git rev-parse HEAD)

          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "$1"; out should_run false; exit 0; }

          if [ "$EVENT_NAME" = "release" ]; then
            [[ "$TAG" == vscode-v* ]] || skip "Release $TAG is not a VS Code extension release."
            # Pre-releases are created and published by the workflow_dispatch run.
            [ "$IS_PRERELEASE" != "true" ] || skip "Pre-release $TAG is published by its own dispatch run."
            [ "${TAG#vscode-v}" = "$version" ] || { echo "::error::Tag $TAG does not match extensions/vscode/package.json version $version"; exit 1; }
            (( minor % 2 == 0 )) || { echo "::error::$version has an odd minor version. Stable releases use even minors; odd minors are for pre-releases."; exit 1; }
            out channel stable; out version "$version"; out tag "$TAG"; out ref "$sha"
          elif [ "$CHANNEL_INPUT" = "republish" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Republishing runs from main (got $GITHUB_REF)."; exit 1; }
            [[ "$TAG_INPUT" == vscode-v* ]] || { echo "::error::tag must be a VS Code release tag such as vscode-v1.6.10 (got '$TAG_INPUT')."; exit 1; }
            rver="${TAG_INPUT#vscode-v}"
            rminor=$((10#$(echo "$rver" | cut -d. -f2)))
            (( rminor % 2 == 0 )) || { echo "::error::$rver has an odd minor version. Only stable releases are republished."; exit 1; }
            release=$(gh release view "$TAG_INPUT" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,assets) || { echo "::error::There is no release $TAG_INPUT."; exit 1; }
            [ "$(echo "$release" | jq -r '.isPrerelease or .isDraft')" = "false" ] || { echo "::error::$TAG_INPUT is a draft or a pre-release."; exit 1; }
            [ "$(echo "$release" | jq '[.assets[] | select(.name | endswith(".vsix"))] | length')" -gt 0 ] || { echo "::error::$TAG_INPUT has no .vsix assets."; exit 1; }
            out channel republish; out version "$rver"; out tag "$TAG_INPUT"; out ref "$sha"
            echo "Republishing $TAG_INPUT from its release assets."
          elif [ "$CHANNEL_INPUT" = "pre-release" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Pre-releases are published from main (got $GITHUB_REF)."; exit 1; }
            (( minor % 2 == 0 )) || { echo "::error::package.json version $version should be a stable (even-minor) version."; exit 1; }
            pre_minor=$((minor + 1))
            last=$(git tag -l "vscode-v${major}.${pre_minor}.*" | sed "s/^vscode-v${major}\.${pre_minor}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            patch=$(( ${last:--1} + 1 ))
            pre="${major}.${pre_minor}.${patch}"
            out channel pre-release; out version "$pre"; out tag "vscode-v$pre"; out ref "$sha"
            echo "Pre-release $pre from main at $sha (stable is $version)."
          else
            out channel dry-run; out version ""; out tag ""; out ref "$sha"
            echo "Dry run of $version at $sha."
          fi
          out should_run true

  build:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.channel != 'republish'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Report every target instead of cancelling the rest on the first
      # failure. Publishing still needs all of them to succeed.
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 because node-gyp 8 didn't recognise the
          # Visual Studio 2026 on windows-latest (windows-2025-vs2026). With
          # sqlite3 gone, node-gyp only builds optional addons, so this can
          # move back to windows-latest once a dry run passes there.
          - { os: windows-2022, platform: win32, arch: x64, npm_config_arch: x64 }
          - { os: windows-2022, platform: win32, arch: arm64, npm_config_arch: arm }
          - { os: ubuntu-latest, platform: linux, arch: x64, npm_config_arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: arm64, npm_config_arch: arm64 }
          - { os: ubuntu-latest, platform: linux, arch: armhf, npm_config_arch: arm }
          - { os: ubuntu-latest, platform: alpine, arch: x64, npm_config_arch: x64 }
          - { os: macos-latest, platform: darwin, arch: x64, npm_config_arch: x64 }
          - { os: macos-latest, platform: darwin, arch: arm64, npm_config_arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEXTCLI_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEXTCLI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
          pre-release: ${{ needs.resolve.outputs.channel == 'pre-release' }}
          version: ${{ needs.resolve.outputs.version }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"

  github-release:
    # Attaches the .vsix files to the GitHub release. For a pre-release it
    # creates the tag and release first, so the version is reserved before it
    # is published. GITHUB_TOKEN is used on purpose: a release it creates does
    # not trigger this workflow again.
    needs: [resolve, build]
    if: needs.resolve.outputs.channel == 'stable' || needs.resolve.outputs.channel == 'pre-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Create the pre-release
        if: needs.resolve.outputs.channel == 'pre-release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          gh release create "$TAG" vsix-artifacts/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --latest=false \
            --title "VS Code extension $VERSION (pre-release)" \
            --generate-notes

      - name: Attach to the stable release
        if: needs.resolve.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" vsix-artifacts/*.vsix --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [resolve, build, github-release]
    if: needs.resolve.outputs.channel == 'stable' || needs.resolve.outputs.channel == 'pre-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Marketplace trusted publishers are bound to these environment names.
    environment: ${{ needs.resolve.outputs.channel == 'stable' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      PRE_RELEASE_FLAG: ${{ needs.resolve.outputs.channel == 'pre-release' && '--pre-release' || '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # Only the checker script, to read the README that is about to be published
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The Marketplace and Open VSX load the README images from the URLs in the
      # README inside the package, and the page can't be fixed without another
      # release. Check that every image loads before publishing.
      - name: Check the README images in the package
        run: |
          vsix="$(ls vsix-artifacts/*.vsix | head -n 1)"
          readme="$(unzip -Z1 "$vsix" | grep -i -m1 '^extension/readme\.md$' || true)"
          if [ -z "$readme" ]; then
            echo "No README in $vsix" >&2
            exit 1
          fi
          unzip -p "$vsix" "$readme" > /tmp/vsix-readme.md
          node scripts/ci/check-readme-images.mjs --live --no-local /tmp/vsix-readme.md

      # Both publish steps skip versions that already exist, so the job can be
      # re-run after a partial failure.
      # Pre-releases go to the Marketplace only: Open VSX serves the highest
      # version as the default even when it's a pre-release, so editors that
      # install from it would get the pre-release
      - name: Publish to Open VSX
        if: needs.resolve.outputs.channel != 'pre-release'
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate $PRE_RELEASE_FLAG --packagePath vsix-artifacts/*.vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate $PRE_RELEASE_FLAG --packagePath vsix-artifacts/*.vsix

      - name: Summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          {
            echo "## Published nextcli.nextcli $VERSION ($CHANNEL)"
            echo "- https://open-vsx.org/extension/nextcli/nextcli"
            echo "- https://marketplace.visualstudio.com/items?itemName=nextcli.nextcli"
          } >> "$GITHUB_STEP_SUMMARY"

  republish:
    # Publishes the .vsix files of a stable release that exists on GitHub but
    # was never published. See the header. The package is not rebuilt.
    needs: resolve
    if: needs.resolve.outputs.channel == 'republish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Marketplace trusted publisher is bound to this file with env `production`
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Checkout first: it cleans untracked files, which would delete the
      # package downloaded below. Only the checker script is needed.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the .vsix files of the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir vsix-artifacts

      # The Marketplace and Open VSX load the README images from the URLs in the
      # README inside the package, and the page can't be fixed without another
      # release. Check that every image loads before publishing.
      - name: Check the README images in the package
        run: |
          vsix="$(ls vsix-artifacts/*.vsix | head -n 1)"
          readme="$(unzip -Z1 "$vsix" | grep -i -m1 '^extension/readme\.md$' || true)"
          if [ -z "$readme" ]; then
            echo "No README in $vsix" >&2
            exit 1
          fi
          unzip -p "$vsix" "$readme" > "$RUNNER_TEMP/vsix-readme.md"
          node scripts/ci/check-readme-images.mjs --live --no-local "$RUNNER_TEMP/vsix-readme.md"

      # Both publish steps skip versions that already exist, so this can be
      # run again after a partial failure.
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate --packagePath vsix-artifacts/*.vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath vsix-artifacts/*.vsix

      - name: Summary
        run: |
          {
            echo "## Republished nextcli.nextcli ${TAG#vscode-v}"
            echo "- https://open-vsx.org/extension/nextcli/nextcli"
            echo "- https://marketplace.visualstudio.com/items?itemName=nextcli.nextcli"
          } >> "$GITHUB_STEP_SUMMARY"
