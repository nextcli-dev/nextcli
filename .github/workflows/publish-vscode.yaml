name: Publish VS Code Extension

# Open VSX allows one trusted publisher per extension, and that registration
# names a single workflow file. Pre-releases and stable releases therefore both
# publish from this file:
#
#   odd minor  (1.3.x) -> "prereleased" release -> publish-preview (staging)
#   even minor (1.4.x) -> "released" release    -> publish-stable  (production)
#
# The two publish jobs run in different GitHub environments, so the Open VSX
# trusted publisher for nextcli.nextcli must name this file and leave the
# environment blank.

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      publish_build:
        description: "Whether or not to publish the built extension to Open VSX"
        required: true
        default: "false"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release channel
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./extensions/vscode/package.json').version")
          minor=$((10#$(echo "$version" | cut -d. -f2)))
          if (( minor % 2 == 0 )); then channel=stable; else channel=preview; fi

          should_run=true
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-vscode$ ]]; then
              echo "Release $TAG is not a VS Code extension release, skipping."
              should_run=false
            elif [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
              echo "::error::Tag $TAG does not match extensions/vscode/package.json version $version"
              exit 1
            elif [[ "$EVENT_ACTION" == "prereleased" && "$channel" != "preview" ]]; then
              echo "::warning::$TAG has an even minor version but was published as a pre-release, skipping. Even minors ship as stable releases."
              should_run=false
            elif [[ "$EVENT_ACTION" == "released" && "$channel" != "stable" ]]; then
              echo "::warning::$TAG has an odd minor version but was published as a full release, skipping. Odd minors ship as pre-releases."
              should_run=false
            fi
          fi

          echo "Version $version -> channel $channel, should_run=$should_run"
          echo "channel=$channel" >> $GITHUB_OUTPUT
          echo "should_run=$should_run" >> $GITHUB_OUTPUT

  build:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: windows-latest
            platform: win32
            arch: arm64
            npm_config_arch: arm
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            npm_config_arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: armhf
            npm_config_arch: arm
          - os: ubuntu-latest
            platform: alpine
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEXTCLI_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEXTCLI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
          pre-release: ${{ needs.resolve.outputs.channel == 'preview' }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"

  release:
    # Only attach files to a real GitHub release. A manual run has no release
    # to attach to; its .vsix files stay available as workflow artifacts.
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Download the .vsix artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            vsix-artifacts/*.vsix
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: nextcli-dev/nextcli
          prerelease: ${{ needs.resolve.outputs.channel == 'preview' }}

  publish-preview:
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.channel == 'preview' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true')
    environment: staging
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # 0. Setup git
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes from release
        run: git fetch origin ${{ github.ref }} && git checkout ${{ github.ref }}

      # 1. Download the artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # 2. Publish the extension to Open VSX Registry
      - name: Publish (Open VSX Registry)
        run: |
          cd extensions/vscode
          npx --yes ovsx@1.3.0 publish --pre-release --trusted-publishing --packagePath ../../vsix-artifacts/*.vsix

      # 3. Create PR with version bump
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Create PR branch
        run: |
          BRANCH_NAME="chore/bump-vscode-version-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Bump version in package.json
        run: |
          cd extensions/vscode
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEXTCLI_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEXTCLI_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          title: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          body: |
            Automated PR to bump the VS Code extension version after successful pre-release publication.

            - Bumped version in extensions/vscode/package.json to ${{ env.NEW_VERSION }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          delete-branch: true

  publish-stable:
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.channel == 'stable' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true')
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      # 0. Setup git
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes from release
        run: git fetch origin ${{ github.ref }} && git checkout ${{ github.ref }}

      # 1. Download the artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # 2. Publish the extension to Open VSX Registry
      - name: Publish (Open VSX Registry)
        run: |
          cd extensions/vscode
          npx --yes ovsx@1.3.0 publish --trusted-publishing --packagePath ../../vsix-artifacts/*.vsix
