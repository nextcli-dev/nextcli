name: "CLA Assistant"

# Contributors sign CLA.md by commenting on their pull request. Signatures are
# stored on the `cla-signatures` branch, which the action creates on first use.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    if: github.repository == 'nextcli-dev/nextcli'
    steps:
      - name: "CLA Assistant"
        if: (github.event.issue.pull_request && (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version2/cla.json"
          path-to-document: "https://github.com/nextcli-dev/nextcli/blob/main/CLA.md"
          branch: cla-signatures
          # Maintainers and bots. Everyone else signs once by commenting.
          allowlist: lmolotii,dependabot[bot],github-actions[bot],nextcli-automation[bot]
          signed-commit-message: "CLA signed in $pullRequestNo"
          lock-pullrequest-aftermerge: false
