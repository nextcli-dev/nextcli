name: Release @nextcli/config-yaml

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest published version"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Verify without publishing or tagging"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'nextcli-dev/nextcli'
    uses: ./.github/workflows/reusable-release.yml
    with:
      package-path: packages/config-yaml
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      SEMANTIC_RELEASE_NPM_TOKEN: ${{ secrets.SEMANTIC_RELEASE_NPM_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      RELACE_API_KEY: ${{ secrets.RELACE_API_KEY }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
