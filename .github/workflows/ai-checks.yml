name: AI Checks

# Runs the `review` check from .checks/ on a pull request, on demand, with
# NextCLI. It reports as check run `check/review` and posts one pull request
# comment, edited in place on each run. A review stops at CHECKS_MAX_COST
# dollars (default 1) and posts what it found so far. The other checks in
# .checks/ are not run for now. They are advisory: `ci` is the only required
# check.
#
#   - Add the `ai-review` label to a pull request. The label is removed when
#     the run finishes, so add it again to re-run.
#   - Or run this workflow manually with a pull request number. Use this for
#     pull requests from forks, which get no secrets from the label trigger.
#     It runs the fork's code with this repository's provider key, so read the
#     pull request first.
#
# Checks are read from the pull request's base commit, so a pull request can't
# change the checks that review it. See nextcli-dev/nextcli-checks.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

concurrency:
  group: ai-checks-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-checks:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review'
    uses: nextcli-dev/nextcli-checks/.github/workflows/checks.yml@v3
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr }}
      agent: nextcli
      agent-version: ${{ vars.CHECKS_NEXTCLI_VERSION }}
      check: review
      max-cost: ${{ vars.CHECKS_MAX_COST || '1' }}
      provider: ${{ vars.CHECKS_PROVIDER }}
      model: ${{ vars.CHECKS_MODEL }}
      base-url: ${{ vars.CHECKS_BASE_URL }}
    secrets:
      api-key: ${{ secrets.PROVIDER_API_KEY }}

  remove-label:
    needs: ai-checks
    # Pull requests from forks get a read-only token, which can't edit labels.
    if: >-
      always() && github.event_name == 'pull_request' && github.event.label.name == 'ai-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the ai-review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai-review
