name: AI Checks

# Runs the enabled checks in .checks/ on a pull request, on demand, with NextCLI.
# Each check runs as its own parallel job and reports as check run
# `check/<name>`. One pull request comment holds all results and is edited in
# place on each run. Which checks run is set by the repository variable
# CHECKS_ENABLED, a comma-separated list of file names in .checks/ without .md
# (default: anti-slop,review,security-review,setup-scripts,stale-comments).
# Each check stops at CHECKS_MAX_COST dollars (default 2) and posts what it
# found so far, so a run costs at most that times the number of enabled
# checks. A check whose `paths` match no changed file passes without calling the
# model. Each check gets 25 minutes; the reusable job allows 30. The checks are
# advisory: `ci` is the only required check.
#
#   - Add the `ai-review` label to a pull request. The label is removed when
#     the run finishes, so add it again to re-run.
#   - Or run this workflow manually with a pull request number. Use this for
#     pull requests from forks, which get no secrets from the label trigger.
#     It runs the fork's code with this repository's provider key, so read the
#     pull request first.
#
# Every run spends the provider key, so only lmolotii can start one. Anyone with
# triage access can add a label, so the label alone is not enough. A label added
# by someone else is removed and does nothing. Both the person who started the
# run and the person who re-ran it must be lmolotii (see the `if` below).
#
# Checks are read from the pull request's base commit, so a pull request can't
# change the checks that review it. See nextcli-dev/nextcli-checks.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

# Runs that won't review anything (another label, or someone other than
# lmolotii) get their own group, so they can't cancel a review in progress.
concurrency:
  group: >-
    ai-checks-${{ github.event.pull_request.number || inputs.pr }}-${{
    (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review') &&
    github.actor == 'lmolotii' && github.triggering_actor == 'lmolotii' && 'review' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-checks:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review') &&
      github.actor == 'lmolotii' && github.triggering_actor == 'lmolotii'
    uses: nextcli-dev/nextcli-checks/.github/workflows/checks.yml@v3
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr }}
      agent: nextcli
      agent-version: ${{ vars.CHECKS_NEXTCLI_VERSION }}
      checks: ${{ vars.CHECKS_ENABLED || 'anti-slop,review,security-review,setup-scripts,stale-comments' }}
      max-cost: ${{ vars.CHECKS_MAX_COST || '2' }}
      max-output-tokens: ${{ vars.CHECKS_MAX_OUTPUT_TOKENS || '32000' }}
      provider: ${{ vars.CHECKS_PROVIDER }}
      model: ${{ vars.CHECKS_MODEL }}
      base-url: ${{ vars.CHECKS_BASE_URL }}
      timeout-per-check: "25"
    secrets:
      api-key: ${{ secrets.PROVIDER_API_KEY }}

  # Safety net. The comment is posted by a job inside the reusable workflow. If
  # that job never starts (run 42669709525 lost it and still spent the money),
  # post the combined comment from the uploaded check results here. Does nothing
  # when the comment for this commit is already there.
  report:
    needs: ai-checks
    if: always() && needs.ai-checks.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Look for the comment of this commit
        id: existing
        run: |
          sha="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          found="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -cF "Commit \`${sha:0:7}\`" || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${found:-0}" -gt 0 ]; then
            echo "A comment for ${sha:0:7} exists."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No AI review comment for ${sha:0:7}; posting it from the check results."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download check results
        if: steps.existing.outputs.missing == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-results*
          path: ${{ runner.temp }}/check-results
          merge-multiple: true

      - name: Post the combined comment
        if: steps.existing.outputs.missing == 'true'
        uses: nextcli-dev/nextcli-checks@v3
        with:
          mode: comment
          pr-number: ${{ env.PR }}
          results-dir: ${{ runner.temp }}/check-results
          max-cost: ${{ vars.CHECKS_MAX_COST || '2' }}

  remove-label:
    needs: [ai-checks, report]
    # Pull requests from forks get a read-only token, which can't edit labels.
    if: >-
      always() && github.event_name == 'pull_request' && github.event.label.name == 'ai-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the ai-review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai-review
