name: "Label / close stale issues and PRs"

# Two policies:
#   1. Issues waiting on the reporter (label `needs-info`) go stale after 14
#      days and close 7 days later. Any reply removes `stale` and `needs-info`.
#   2. Every other issue goes stale after 60 days and closes 14 days later.
#      Pull requests go stale after 30 days and close 14 days later.
# Policy 2 exempts assigned or milestoned items, drafts, release PRs, and the
# labels `pinned`, `security`, `no-stale`.
#
# Run it manually with "debug only" to see what it would do without changing
# anything.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      debug-only:
        description: "Dry run: log what would happen, change nothing"
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    if: github.repository == 'nextcli-dev/nextcli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Issues waiting on the reporter
        uses: actions/stale@v11
        with:
          debug-only: ${{ inputs.debug-only || false }}
          only-issue-labels: "needs-info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: "stale"
          labels-to-remove-when-unstale: "needs-info"
          close-issue-reason: "not_planned"
          stale-issue-message: >
            We asked for more information on this issue 14 days ago and haven't heard back.
            If it still happens, please reply with the requested details and it will stay open.
            Otherwise it will be closed in 7 days.
          close-issue-message: >
            Closing because we didn't get the information needed to look into this.
            If you can still reproduce it, reply with the details and we'll reopen it.
          # Assignment is not exempt here: the maintainer is often assigned
          # while waiting on the reporter.
          operations-per-run: 100

      - name: Inactive issues and pull requests
        uses: actions/stale@v11
        with:
          debug-only: ${{ inputs.debug-only || false }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          # Issues with `needs-info` are handled by the step above.
          exempt-issue-labels: "needs-info,pinned,security,no-stale"
          exempt-pr-labels: "pinned,security,no-stale,autorelease: pending"
          exempt-draft-pr: true
          exempt-all-issue-assignees: true
          exempt-all-milestones: true
          close-issue-reason: "not_planned"
          stale-issue-message: >
            This issue has had no activity for 60 days. Is it still relevant on the latest version?
            Leave a comment to keep it open; otherwise it will be closed in 14 days.
            Closed issues can always be reopened.
          close-issue-message: >
            Closing after 74 days without activity. If it still applies to the latest version,
            comment and we'll reopen it.
          stale-pr-message: >
            This pull request has had no activity for 30 days. Push a commit or leave a comment
            to keep it open; otherwise it will be closed in 14 days.
          close-pr-message: >
            Closing after 44 days without activity. Feel free to reopen it when you pick it up again.
          operations-per-run: 100
